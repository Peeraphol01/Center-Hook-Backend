paths:
  /api/dashboard:
    get:
      tags:
        - Dashboard
      summary: สรุป forward log สำหรับหน้า Dashboard
      description: >-
        ตัดวันตามเวลาไทย (Asia/Bangkok) from/to เป็นวันที่ YYYY-MM-DD นับทั้งวัน (00:00-23:59 น.) |
        ไม่ส่งทั้งคู่ = วันนี้, ส่งแค่ from = วันนั้นวันเดียว, ส่ง to ต้องส่ง from ด้วย |
        ช่วงยาวสุดเท่าอายุ forward log (FORWARD_LOG_RETENTION_DAYS ค่าเริ่มต้น 90 วัน) |
        กราฟ (timeseries) ช่วง 1 วันแยกรายชั่วโมง (24 ช่อง) มากกว่านั้นแยกรายวัน ช่องที่ไม่มี log เป็น 0 |
        frontend เลือกช่วง 24h/7d/30d เองแล้วส่งเป็นวันที่ เช่น 7 วันล่าสุด = from=วันนี้-6&to=วันนี้
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          description: วันเริ่มต้น (YYYY-MM-DD ตามเวลาไทย) ไม่ส่ง = วันนี้
          schema:
            type: string
            format: date
          example: "2026-11-05"
        - in: query
          name: to
          description: วันสิ้นสุด นับรวมทั้งวัน (YYYY-MM-DD) ไม่ส่ง = วันเดียวกับ from ต้องไม่ก่อน from
          schema:
            type: string
            format: date
          example: "2026-11-07"
        - in: query
          name: project
          description: กรองเฉพาะ project (ค่า smm_app หรือ default) ไม่ส่ง = ทุก project
          schema:
            type: string
            maxLength: 50
          example: newlabor
      responses:
        "200":
          description: สรุปตามช่วงวัน
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  schemas:
    DashboardStatusCounts:
      type: object
      properties:
        total:
          type: integer
          example: 120
        success:
          type: integer
          example: 110
        failed:
          type: integer
          example: 6
        skipped:
          type: integer
          example: 4
    DashboardResponse:
      type: object
      properties:
        range:
          type: object
          description: ช่วงที่ใช้จริง (start/end = ขอบเวลา UTC ของช่วง end ไม่นับรวม)
          properties:
            from:
              type: string
              format: date
              example: "2026-11-05"
            to:
              type: string
              format: date
              example: "2026-11-07"
            timezone:
              type: string
              example: Asia/Bangkok
            interval:
              type: string
              enum:
                - hour
                - day
              example: day
            start:
              type: string
              format: date-time
              example: "2026-11-04T17:00:00.000Z"
            end:
              type: string
              format: date-time
              example: "2026-11-07T17:00:00.000Z"
        totals:
          allOf:
            - $ref: "#/components/schemas/DashboardStatusCounts"
            - type: object
              properties:
                success_rate:
                  type: number
                  nullable: true
                  description: success / (success + failed) ปัด 4 ตำแหน่ง null = ยังไม่มี event ที่ส่งต่อ
                  example: 0.9483
                inbound:
                  type: integer
                  example: 100
                outbound:
                  type: integer
                  example: 20
                active_line_users:
                  type: integer
                  description: จำนวน LINE user/group ที่มี log ในช่วงนี้ (ไม่ซ้ำ)
                  example: 35
                avg_duration_ms:
                  type: integer
                  nullable: true
                  description: เวลาเฉลี่ยของ SUCCESS/FAILED (SKIPPED ไม่ได้ส่งต่อ)
                  example: 412
        timeseries:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  bucket:
                    type: string
                    format: date-time
                    description: เวลาเริ่มของช่อง (ต้นชั่วโมง/ต้นวันตามเวลาไทย แสดงเป็น UTC)
                    example: "2026-11-04T17:00:00.000Z"
              - $ref: "#/components/schemas/DashboardStatusCounts"
        by_project:
          type: array
          description: เรียงจำนวนมากไปน้อย
          items:
            allOf:
              - type: object
                properties:
                  project:
                    type: string
                    example: newlabor
                  success_rate:
                    type: number
                    nullable: true
                    example: 0.95
                  avg_duration_ms:
                    type: integer
                    nullable: true
                    example: 380
              - $ref: "#/components/schemas/DashboardStatusCounts"
        recent_failures:
          type: array
          description: log ที่ส่งไม่สำเร็จล่าสุด 5 รายการ (ดูเต็มที่ GET /api/forward-logs/{id})
          items:
            type: object
            properties:
              id:
                type: integer
                example: 991
              project:
                type: string
                example: newlabor
              direction:
                type: string
                enum:
                  - INBOUND
                  - OUTBOUND
              event_type:
                type: string
                example: message
              line_user_id:
                type: string
                nullable: true
              http_status:
                type: integer
                nullable: true
                example: 500
              error_message:
                type: string
                nullable: true
              created_at:
                type: string
                format: date-time
