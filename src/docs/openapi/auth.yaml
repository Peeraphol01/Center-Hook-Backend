paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login ด้วย username/password
      description: >-
        คืน access_token + refresh_token พร้อม profile และสิทธิ์ | 1 บัญชีใช้ได้ 1 เครื่อง (ทุก role)
        | login ซ้ำจากเครื่องเดิม (device_id ตรง) = แทน session เดิมทันที
        | บัญชีใช้งานอยู่บนเครื่องอื่น = ตอบ 409 ACTIVE_ON_OTHER_DEVICE ส่งซ้ำพร้อม replace_session true เพื่อเตะเครื่องเดิมออก
        (เครื่องเดิมได้ 401 SESSION_REPLACED, บันทึก auth.session.replaced และแจ้งเตือนเข้า LINE)
        | ไม่ส่ง device_id = ถือเป็นเครื่องใหม่ทุกครั้ง
        | รหัสผิด, ไม่มี username หรือบัญชีถูกปิด ตอบ 401 INVALID_CREDENTIALS เหมือนกัน
        | จำกัด LOGIN_RATE_LIMIT_MAX_REQUESTS ครั้งต่อ RATE_LIMIT_WINDOW_MS ต่อ IP (ค่าเริ่มต้น 10 ครั้งต่อนาที)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: owner
                password:
                  type: string
                  format: password
                  example: Owner@123456
                device_id:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{16,128}$"
                  description: รหัสเครื่อง (หน้าเว็บสร้างเก็บในคุกกี้ ch_device อายุ 1 ปี)
                  example: 0b7c8f5e-3f1a-4d2b-9c6e-1a2b3c4d5e6f
                replace_session:
                  type: boolean
                  description: true = ยืนยันเตะ session ของเครื่องเดิมออก (ส่งหลังได้ 409 ACTIVE_ON_OTHER_DEVICE)
      responses:
        "200":
          description: Login สำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TokenResponse"
                  - type: object
                    properties:
                      profile:
                        $ref: "#/components/schemas/AccountWithPermissions"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: username หรือรหัสผ่านไม่ถูกต้อง (INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status_code: 401
                code: INVALID_CREDENTIALS
                message: Invalid username or password.
        "409":
          description: >-
            บัญชีใช้งานอยู่บนเครื่องอื่น (ACTIVE_ON_OTHER_DEVICE) แนบข้อมูลเครื่องเดิมให้ผู้ใช้ตัดสินใจ
            | ส่ง request เดิมซ้ำพร้อม replace_session true เพื่อเตะเครื่องเดิมออก
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status_code: 409
                code: ACTIVE_ON_OTHER_DEVICE
                message: This account is signed in on another device.
                other_device:
                  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0
                  ip_address: 203.0.113.10
                  last_active_at: "2026-11-28T03:15:00.000Z"
        "423":
          description: >-
            บัญชีถูกล็อกชั่วคราว (ACCOUNT_LOCKED) ใส่รหัสผิดติดกันครบ LOGIN_MAX_FAILED_ATTEMPTS ครั้ง (5) ล็อก LOGIN_LOCK_MINUTES นาที (15)
            ระหว่างล็อกรหัสถูกก็เข้าไม่ได้ | login สำเร็จรีเซ็ตตัวนับ | ปลดล็อกเองเมื่อครบเวลา
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status_code: 423
                code: ACCOUNT_LOCKED
                message: Too many failed login attempts. Account is temporarily locked.
                locked_until: "2026-11-19T10:15:00.000Z"
                retry_after_seconds: 900
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: ขอ token ชุดใหม่ด้วย refresh token
      description: >-
        refresh token ใช้ได้ครั้งเดียว (ใช้ซ้ำตอบ 401 INVALID_REFRESH_TOKEN) | สิทธิ์ใน access token ใหม่อ่านจาก DB ล่าสุด
        | session มีอายุ JWT_REFRESH_EXPIRES_IN นับจาก login (ค่าเริ่มต้น 24 ชั่วโมง) ครบแล้วต้อง login ใหม่
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token ชุดใหม่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: refresh token ผิด ใช้ไปแล้ว หรือ session ถูก revoke (INVALID_REFRESH_TOKEN) / หมดอายุ (TOKEN_EXPIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: บัญชีถูกปิด (ACCOUNT_INACTIVE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout (revoke session ปัจจุบัน)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: ข้อมูลบัญชีตัวเองพร้อมสิทธิ์ล่าสุด
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ข้อมูลบัญชี
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithPermissions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/me/password:
    patch:
      tags:
        - Auth
      summary: เปลี่ยนรหัสผ่านของตัวเอง
      description: session ปัจจุบันใช้ต่อได้ | รหัสใหม่ 8-128 ตัวและต้องไม่ซ้ำรหัสเดิม
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
      responses:
        "200":
          description: เปลี่ยนรหัสผ่านแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: ข้อมูลไม่ผ่าน (VALIDATION_ERROR) หรือรหัสผ่านปัจจุบันผิด (INVALID_CURRENT_PASSWORD)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
